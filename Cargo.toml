[package]
name = "bosskey"
version = "0.0.1"
edition = "2021"
description = "Windows 老板键：一键隐藏/显示指定程序的窗口与任务栏按钮"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
